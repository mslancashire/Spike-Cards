services:
  cards.api.minimal:
    image: ${DOCKER_REGISTRY-}cardsapiminimal
    build:
      context: .
      dockerfile: ../../src/Cards.API.Minimal/Dockerfile
    ports:
      - 5000:8080
      - 5001:8081
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=cards.db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Include Error Detail=true
    depends_on:
      cards.db:
        condition: service_healthy
    restart: always
    networks:
      - "default"

  cards.db:
    image: postgres:18-alpine
    container_name: dotnet_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
          - ./.containers/database:/var/lib/postgressql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - "default"

  cards.admin.db:
    image: dpage/pgadmin4
    container_name: dotnet_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      cards.db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - "default"

